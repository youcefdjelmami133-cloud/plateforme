<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>بطاقة حيوان</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>الحيوان DZ-0002</h1>
    <p>نعجة من سلالة أولاد جلال</p>
    <p>المرحلة الحالية: أواخر الحمل</p>

    <!-- تمرين الدرس 1: تاريخ الميلاد -->
    <p>تاريخ الميلاد: <strong>20/02/2022</strong></p>

    <!-- قسم الأحداث -->
    <h2>الأحداث</h2>
    <form id="event-form">
      <label>التاريخ:
        <input type="date" id="event-date" required>
      </label>
      <br><br>

      <label>نوع الحدث:
        <select id="event-type">
          <option>ولادة</option>
          <option>تلقيح</option>
          <option>تشخيص حمل</option>
          <option>علاج</option>
        </select>
      </label>
      <br><br>

      <label>ملاحظات:<br>
        <textarea id="event-notes" rows="3" cols="30" placeholder="مثلاً: تلقى اللقاح بنجاح"></textarea>
      </label>
      <br><br>

      <button type="submit">حفظ الحدث</button>
    </form>

    <h2>الأحداث المسجلة</h2>
    <table id="events-table" border="1">
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>نوع الحدث</th>
          <th>ملاحظات</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <!-- ====== جدول الأوزان (كان ناقصاً) ====== -->
    <h2>الأوزان</h2>
    <table id="weights-table" border="1">
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>الوزن (كغ)</th>
          <th>النوع</th>
          <th>ملاحظات</th>
          <th>رقم الأذن</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <!-- نموذج تسجيل وزن جديد -->
    <h2>تسجيل وزن جديد</h2>
    <form id="weight-form">
      <label>التاريخ:
        <input type="date" id="date-input" required>
      </label>
      <br><br>

      <label>الوزن (كغ):
        <input type="number" step="0.1" id="weight-input" required>
      </label>
      <br><br>

      <label>النوع:
        <select id="type-input">
          <option>ميلاد</option>
          <option>فطام</option>
          <option>عادي</option>
        </select>
      </label>
      <br><br>

      <label>ملاحظات:<br>
        <textarea id="notes-input" rows="3" cols="30" placeholder="أي ملاحظات إضافية..."></textarea>
      </label>
      <br><br>

      <label>رقم الأذن:
        <input type="text" id="ear-input" placeholder="مثال: DZ-0002">
      </label>
      <br><br>

      <button type="submit">حفظ</button>
    </form>
  </div>

  <script src="app.js" defer></script>
  <script src="data.js"></script>
</body>
</html>
